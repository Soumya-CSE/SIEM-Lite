<!DOCTYPE html>

<html>

<head>

<title>
Analysis Result
</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="container">


<h1>
Security Analysis Report
</h1>



<div class="cards">


<div class="card">
<h2>{{data.total}}</h2>
<p>Total Logs</p>
</div>


<div class="card">
<h2>{{data.success}}</h2>
<p>Successful Login</p>
</div>



<div class="card danger">
<h2>{{data.failed}}</h2>
<p>Failed Login</p>
</div>


<div class="card">
<h2>{{data.ips}}</h2>
<p>IP Address</p>
</div>


</div>



<h2>
🚨 Suspicious Activity
</h2>


<table>


<tr>

<th>User</th>
<th>Attempts</th>
<th>Severity</th>

</tr>


{% for item in data.suspicious %}

<tr>

<td>{{item.user}}</td>

<td>{{item.attempts}}</td>

<td class="danger">
{{item.level}}
</td>

</tr>


{% endfor %}


</table>


</div>


</body>

</html>
